<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dynamic Website</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth scrolling */
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

  <!-- Navigation -->
  <nav class="p-6 max-w-5xl mx-auto w-full flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-tight text-indigo-400">MyBrand</h1>
    <div class="space-x-4 text-sm text-slate-300">
      <a href="#about" class="hover:text-white transition">About</a>
      <a href="#interactive" class="hover:text-white transition">Interactive</a>
    </div>
  </nav>

  <!-- Hero Section with Animation -->
  <main class="max-w-5xl mx-auto px-6 py-16 text-center md:text-left">
    <div class="animate-fade-in">
      <h2 class="text-4xl md:text-6xl font-extrabold leading-tight">
        Hello, I'm <span id="typing-text" class="text-indigo-400 border-r-2 border-indigo-400 pr-1"></span>
      </h2>
      <p class="mt-4 text-slate-400 text-lg max-w-xl">
        Welcome to my interactive website! Built with dynamic features and smooth animations.
      </p>
    </div>

    <!-- Interactive Component -->
    <div id="interactive" class="mt-12 p-6 bg-slate-800 rounded-xl border border-slate-700 max-w-md">
      <h3 class="text-lg font-semibold text-slate-200">Interactive Counter</h3>
      <p class="text-slate-400 text-sm mt-1">Click the button to update the state dynamically.</p>
      
      <div class="mt-4 flex items-center space-x-4">
        <span id="counter" class="text-3xl font-bold text-indigo-400">0</span>
        <button onclick="incrementCounter()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-white font-medium transition transform active:scale-95">
          Click Me
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="p-6 text-center text-slate-500 text-sm border-t border-slate-800">
    © 2026 Billy. Built with dynamic JS & CSS animations.
  </footer>

  <!-- Dynamic JavaScript -->
  <script>
    // Typing effect logic
    const words = ["a Developer.", "a Creator.", "Billy."];
    let wordIndex = 0, charIndex = 0, isDeleting = false;

    function typeEffect() {
      const currentWord = words[wordIndex];
      const target = document.getElementById("typing-text");

      if (isDeleting) {
        target.textContent = currentWord.substring(0, charIndex--);
      } else {
        target.textContent = currentWord.substring(0, charIndex++);
      }

      let speed = isDeleting ? 50 : 100;
      if (!isDeleting && charIndex === currentWord.length + 1) {
        speed = 1500;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        wordIndex = (wordIndex + 1) % words.length;
        speed = 500;
      }

      setTimeout(typeEffect, speed);
    }
    typeEffect();

    // Counter logic
    let count = 0;
    function incrementCounter() {
      count++;
      document.getElementById("counter").textContent = count;
    }
  </script>

</body>
</html>
